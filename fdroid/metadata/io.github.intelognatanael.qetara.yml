AutoName: Qetara
Summary: Share files and messages between devices on your local network
Description: |-
  Share files and messages between Android devices and a desktop computer on
  the same local network, without an account. Android devices can also connect
  using Wi-Fi Direct.

  Select multiple files, track each transfer, cancel pending files and open
  received downloads. Android's share menu can send files to Qetara.

  The optional Flash mode offers nearby file sharing with confirmation on both
  devices. It starts disabled and expires after 30 minutes.

